name: Mobile Automation CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-framework:
    name: Framework Validation & Test Discovery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Copy Example Environment
        run: cp .env.example .env

      - name: Verify Test Discovery & Syntax
        run: |
          pytest --collect-only -v

  android-emulator-tests:
    name: Android Emulator Smoke Tests
    runs-on: macos-13
    needs: validate-framework
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js for Appium
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium and UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare Environment File
        run: cp .env.example .env

      - name: Start Appium Server in Background
        run: |
          appium --log-timestamp --log-no-colors > appium.log 2>&1 &
          sleep 5
          curl --retry 5 --retry-connrefused http://127.0.0.1:4723/status

      - name: Run Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install --bypass-low-target-sdk-block apps/testdpc.apk
            pytest tests/test_setup_flow.py -v

      - name: Upload Test Reports & Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-and-logs
          path: |
            reports/
            appium.log
